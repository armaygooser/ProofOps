name: proofops
services:
  proofops-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      PROOFOPS_API_HOST: 0.0.0.0
      PROOFOPS_API_PORT: 18765
      PROOFOPS_DEMO_MODE: ${PROOFOPS_DEMO_MODE:-deterministic}
      PROOFOPS_AUDIT_HMAC_KEY: ${PROOFOPS_AUDIT_HMAC_KEY:-proofops-demo-audit-key-change-before-production-2026}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "18765:18765"
    networks: [proofops-net]

  proofops-web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      proofops-api:
        condition: service_healthy
    ports:
      - "18766:80"
    networks: [proofops-net]

networks:
  proofops-net:
    name: proofops-net
